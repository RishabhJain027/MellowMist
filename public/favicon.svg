<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Dynamic Ambient Waves / Mist Lines -->
  <g filter="url(#glow)">
    <!-- Wave 1: Gentle High Wave -->
    <path d="M 28 48 C 44 38, 56 58, 72 48 C 88 38, 100 52, 100 52" 
          fill="none" 
          stroke="url(#mistGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.9" />

    <!-- Wave 2: Center Main Wave -->
    <path d="M 28 66 C 44 54, 60 76, 76 64 C 88 56, 100 70, 100 70" 
          fill="none" 
          stroke="url(#mistGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <!-- Wave 3: Deep Base Wave -->
    <path d="M 28 84 C 42 74, 58 92, 74 82 C 86 76, 100 86, 100 86" 
          fill="none" 
          stroke="url(#mistGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.8" />

    <!-- Glowing Dew Drop / Sound Particle -->
    <circle cx="86" cy="40" r="3.5" fill="#5eead4" />
    <circle cx="42" cy="78" r="2.5" fill="#38bdf8" />
  </g>
</svg>
